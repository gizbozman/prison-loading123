<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТюрьмаRP — загрузка</title>
<style>
    :root {
        --void: #070605;
        --soil: #110e0a;
        --ember: #c48a3e;
        --ember-soft: rgba(196, 138, 62, 0.35);
        --ember-dim: #8a5e28;
        --paper: #efe6d6;
        --mute: #a89a86;
        --faint: #6e6354;
        --line: rgba(196, 138, 62, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--void);
        color: var(--paper);
        font-family: "Manrope", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* ---- atmosphere ---- */

    #world {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 90% 55% at 50% 115%, rgba(90, 55, 22, 0.28), transparent 55%),
            radial-gradient(ellipse 70% 45% at 72% -10%, rgba(196, 138, 62, 0.12), transparent 50%),
            linear-gradient(180deg, #0c0a08 0%, #080706 42%, #050403 100%);
    }

    #beam {
        position: absolute;
        top: -18%;
        left: 58%;
        width: 55vw;
        height: 120vh;
        transform: translateX(-50%) rotate(8deg);
        background: linear-gradient(180deg,
            rgba(255, 210, 140, 0.14) 0%,
            rgba(196, 138, 62, 0.06) 35%,
            transparent 72%);
        filter: blur(2px);
        animation: sweep 18s ease-in-out infinite alternate;
        pointer-events: none;
    }

    @keyframes sweep {
        from { left: 52%; opacity: 0.75; }
        to   { left: 66%; opacity: 1; }
    }

    #silhouettes {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        pointer-events: none;
    }

    #silhouettes svg {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 58%;
    }

    #fence-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 42px;
        opacity: 0.4;
        background:
            repeating-linear-gradient(90deg, transparent 0 14px, rgba(90, 72, 48, 0.9) 14px 16px),
            repeating-linear-gradient(45deg, transparent 0 8px, rgba(70, 55, 38, 0.85) 8px 9px),
            repeating-linear-gradient(-45deg, transparent 0 8px, rgba(70, 55, 38, 0.85) 8px 9px);
        border-bottom: 1px solid rgba(120, 90, 50, 0.35);
    }

    #haze {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse at 50% 80%, transparent 20%, rgba(0,0,0,0.55) 75%),
            linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 28%, transparent 60%, rgba(0,0,0,0.72) 100%);
        pointer-events: none;
    }

    #grain {
        position: absolute;
        inset: -20%;
        width: 140%;
        height: 140%;
        opacity: 0.07;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        animation: grain 0.45s steps(3) infinite;
    }

    @keyframes grain {
        0% { transform: translate(0, 0); }
        33% { transform: translate(-1.5%, 1%); }
        66% { transform: translate(1%, -1.2%); }
        100% { transform: translate(0, 0); }
    }

    /* ---- main composition ---- */

    #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(28px, 5vh, 56px) clamp(24px, 5vw, 72px);
        z-index: 2;
    }

    #topline {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        opacity: 0;
        animation: rise 0.9s 0.15s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .meta {
        font-family: "IBM Plex Mono", "Consolas", monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
    }

    .meta strong {
        color: var(--mute);
        font-weight: 500;
    }

    #hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        max-width: 820px;
        padding-bottom: 4vh;
        opacity: 0;
        animation: rise 1s 0.28s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    #mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ember);
    }

    #mark::before {
        content: "";
        width: 28px;
        height: 1px;
        background: var(--ember);
        box-shadow: 0 0 12px var(--ember-soft);
    }

    h1 {
        font-family: "Unbounded", "Arial Black", sans-serif;
        font-weight: 700;
        font-size: clamp(42px, 8.5vw, 92px);
        line-height: 0.95;
        letter-spacing: 0.04em;
        color: var(--paper);
        text-shadow: 0 0 60px rgba(196, 138, 62, 0.18);
        margin-bottom: 14px;
    }

    h1 span {
        display: block;
        color: var(--ember);
    }

    #tagline {
        max-width: 38ch;
        font-size: clamp(14px, 1.6vw, 17px);
        line-height: 1.55;
        color: var(--mute);
        font-weight: 400;
    }

    /* ---- bottom dock ---- */

    #dock {
        width: min(720px, 100%);
        opacity: 0;
        animation: rise 0.95s 0.42s cubic-bezier(.2,.8,.2,1) forwards;
    }

    #stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 28px;
        margin-bottom: 18px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--faint);
    }

    #stats b {
        color: var(--paper);
        font-weight: 500;
    }

    #bar-wrap {
        position: relative;
        height: 3px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
    }

    #bar-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 8%;
        background: linear-gradient(90deg, var(--ember-dim), var(--ember));
        box-shadow: 0 0 18px var(--ember-soft);
        transition: width 0.55s cubic-bezier(.2,.8,.2,1);
    }

    #bar-glow {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 48px;
        margin-left: -24px;
        background: radial-gradient(ellipse at center, rgba(255,200,120,0.55), transparent 70%);
        transition: left 0.55s cubic-bezier(.2,.8,.2,1);
        left: 8%;
        pointer-events: none;
    }

    #status {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--mute);
    }

    #status-text::before {
        content: "› ";
        color: var(--ember);
    }

    #pct {
        color: var(--ember);
        white-space: nowrap;
    }

    #tip {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        min-height: 52px;
    }

    #tip-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 6px;
    }

    #tip-text {
        font-size: 14px;
        line-height: 1.5;
        color: var(--mute);
        max-width: 62ch;
        transition: opacity 0.45s ease;
    }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="world">
    <div id="beam"></div>
    <div id="fence-top"></div>
    <div id="silhouettes">
        <svg viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
            <defs>
                <linearGradient id="towerFade" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1a1510" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#0a0806" stop-opacity="0.2"/>
                </linearGradient>
            </defs>
            <!-- far wall -->
            <path fill="#12100c" d="M0 320 L1600 280 L1600 520 L0 520 Z"/>
            <!-- watchtower -->
            <g fill="url(#towerFade)">
                <rect x="1180" y="90" width="78" height="280"/>
                <polygon points="1165,90 1273,90 1219,40"/>
                <rect x="1194" y="120" width="18" height="28" fill="#2a2218"/>
                <rect x="1226" y="120" width="18" height="28" fill="#2a2218"/>
                <rect x="1194" y="180" width="18" height="28" fill="#2a2218"/>
                <rect x="1226" y="180" width="18" height="28" fill="#2a2218"/>
                <rect x="1208" y="40" width="22" height="52" fill="#1a1510"/>
            </g>
            <!-- second tower silhouette -->
            <g fill="#0f0d0a" opacity="0.85">
                <rect x="220" y="150" width="52" height="220"/>
                <polygon points="208,150 284,150 246,110"/>
            </g>
            <!-- wire / posts -->
            <g stroke="#3a2f22" stroke-width="2" fill="none" opacity="0.7">
                <path d="M0 360 Q400 330 800 350 T1600 320"/>
                <path d="M0 380 Q420 355 820 372 T1600 345"/>
            </g>
            <g fill="#2a2218">
                <rect x="90" y="340" width="8" height="90"/>
                <rect x="410" y="325" width="8" height="105"/>
                <rect x="740" y="335" width="8" height="95"/>
                <rect x="1050" y="318" width="8" height="112"/>
                <rect x="1410" y="308" width="8" height="122"/>
            </g>
            <!-- ground -->
            <path fill="#090807" d="M0 420 L1600 390 L1600 520 L0 520 Z"/>
        </svg>
    </div>
    <div id="haze"></div>
    <div id="grain"></div>
</div>

<div id="stage">
    <div id="topline">
        <div class="meta">Личное дело · <strong id="case-no">ВЯ-0000</strong></div>
        <div class="meta" id="online">онлайн · <strong id="players">—</strong></div>
    </div>

    <div id="hero">
        <div id="mark">исправительная колония</div>
        <h1>ТЮРЬМА<span>RP</span></h1>
        <p id="tagline">«Волчий Яр» — строгий режим. Жетоны, ранги, знакомства и свой срок.</p>
    </div>

    <div id="dock">
        <div id="stats">
            <span>сервер · <b id="f-server">ТюрьмаRP</b></span>
            <span>карта · <b id="f-map">—</b></span>
            <span>режим · <b id="f-mode">DarkRP</b></span>
        </div>

        <div id="bar-wrap">
            <div id="bar-fill"></div>
            <div id="bar-glow"></div>
        </div>

        <div id="status">
            <span id="status-text">Установка соединения...</span>
            <span id="pct">8%</span>
        </div>

        <div id="tip">
            <div id="tip-label">совет</div>
            <div id="tip-text">Наведитесь на игрока и нажмите E — пока вы для него «Незнакомец».</div>
        </div>
    </div>
</div>

<script>
(function () {
    document.getElementById("case-no").textContent =
        "ВЯ-" + String(1000 + Math.floor(Math.random() * 8999));

    var progress = 8;
    var barFill = document.getElementById("bar-fill");
    var barGlow = document.getElementById("bar-glow");
    var pctEl = document.getElementById("pct");
    var statusEl = document.getElementById("status-text");

    function setProgress(p) {
        progress = Math.max(progress, Math.min(100, p));
        barFill.style.width = progress + "%";
        barGlow.style.left = progress + "%";
        pctEl.textContent = Math.round(progress) + "%";
    }

    var STATUS_MAP = {
        "Connecting":                  { text: "Подключение к серверу...", p: 12 },
        "Client sending 'connect'":    { text: "Запрос на подключение...", p: 18 },
        "Client received 'challenge'": { text: "Согласование с сервером...", p: 26 },
        "Requesting map":              { text: "Запрос данных карты...", p: 38 },
        "Requesting client info":      { text: "Запрос данных клиента...", p: 48 },
        "Received signon buffers":     { text: "Приём начальных данных...", p: 58 },
        "Sending Client Info":         { text: "Отправка данных клиента...", p: 68 },
        "Signon":                      { text: "Синхронизация с сервером...", p: 80 },
        "Spawn":                       { text: "Вход в зону...", p: 92 },
        "Active":                      { text: "Добро пожаловать.", p: 100 }
    };

    var TIPS = [
        "Наведитесь на игрока и нажмите E — пока вы для него «Незнакомец».",
        "У аккаунта несколько слотов: заключённый или охрана — путь закрепляется.",
        "Статья при создании персонажа даёт пассивный эффект — выбирайте осознанно.",
        "Хотбар 1–4 — быстрый доступ к вещам без открытия инвентаря.",
        "Дело, профиль и татуировки — во вкладке «ТюрьмаРП» в F4.",
        "Чем дольше срок, тем выше тюремный ранг и шире привилегии.",
        "Описание персонажа видят только те, с кем вы познакомились.",
        "Спать можно у койки в камере — подойдите и нажмите E.",
        "Валюта зоны — жетоны. Тратьте их с умом."
    ];

    var tipIndex = 0;
    var tipEl = document.getElementById("tip-text");

    function rotateTip() {
        tipEl.style.opacity = "0";
        setTimeout(function () {
            tipIndex = (tipIndex + 1) % TIPS.length;
            tipEl.textContent = TIPS[tipIndex];
            tipEl.style.opacity = "1";
        }, 380);
    }

    setInterval(rotateTip, 5600);

    // мягкий «пульс», пока движок молчит
    var idle = setInterval(function () {
        if (progress < 40) setProgress(progress + 0.35);
    }, 400);

    window.GameDetails = function (serverName, serverURL, mapName, maxPlayers, steamID, gameMode, volume, language) {
        var s = document.getElementById("f-server");
        var m = document.getElementById("f-map");
        var mode = document.getElementById("f-mode");
        var players = document.getElementById("players");
        if (s) s.textContent = serverName || "ТюрьмаRP";
        if (m) m.textContent = mapName || "—";
        if (mode) mode.textContent = gameMode || "DarkRP";
        if (players && maxPlayers) players.textContent = "до " + maxPlayers;
        setProgress(22);
    };

    window.SetStatusChanged = function (status) {
        clearInterval(idle);
        var known = STATUS_MAP[status];
        if (known) {
            statusEl.textContent = known.text;
            setProgress(known.p);
        } else if (status) {
            statusEl.textContent = status;
            setProgress(progress + 3);
        }
    };

    window.SetFilesNeeded = function (needed) {};
    window.DownloadingFile = function (fileName) {
        if (statusEl && fileName) {
            var short = String(fileName);
            if (short.length > 42) short = "…" + short.slice(-40);
            statusEl.textContent = "Загрузка: " + short;
        }
        if (progress < 75) setProgress(progress + 0.8);
    };

    window.SetFilesTotal = function () {};
    window.SetFilter = function () {};
})();
</script>
</body>
</html>
